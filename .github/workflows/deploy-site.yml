# Deploy the website (apps/solomotion-site), with the docs it renders from its
# own content/docs.
#
# Runs when the site (docs included) or the theme it is built from changes on `main`,
# or by hand from the Actions tab. Releases do not redeploy it: the site reads
# the current version from GitHub Releases.
#
# The Cloudflare secrets live in the `production` environment, which only `main`
# and `v*` tags may use, and they are scoped to the SoloMotion projects alone.
# Pull requests (from forks or not) never trigger this workflow, and a fork's
# own Actions skip it.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - apps/solomotion-site/**
      - packages/theme/**
      - pnpm-lock.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'novincode/solomotion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy to Cloudflare
        run: pnpm --filter ./apps/solomotion-site run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
