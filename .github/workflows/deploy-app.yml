# Deploy the studio (apps/web) to its Cloudflare Worker.
#
# Release calls this after a stable version is published. Run it by hand from
# the Actions tab to redeploy without a release.
#
# The Cloudflare secrets live in the `production` environment, which only `main`
# and `v*` tags may use, and they are scoped to the SoloMotion projects alone.
# Pull requests (from forks or not) never trigger this workflow, and a fork's
# own Actions skip it.
name: Deploy app

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-app
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'novincode/solomotion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy to Cloudflare
        run: pnpm --filter ./apps/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
