# Ship a version: push the tag `v<version>` that matches the root package.json.
#
#   plan      checks the tag against package.json and reads what this repo has
#   verify    the CI workflow, run on everything
#   web       the static editor bundle, for self-hosting
#   desktop   unsigned installers for macOS, Windows and Linux
#   npm       every public @solomotion/* package, through npm Trusted
#             Publishing (OIDC), with provenance and no stored token
#   release   the GitHub Release: notes from CHANGELOG.md, the assets, their
#             checksums and build attestations
#   deploy    the live app, for stable versions only
#
# A version with a pre-release suffix (1.0.0-beta.3) goes to npm under `next`,
# is marked as a pre-release on GitHub and never redeploys the live app.
name: Release

on:
  push:
    tags: ["v*"]

# The public repo has one product, so builds would pick it anyway. Naming it
# means a fork that adds a second product can never ship the wrong one.
env:
  PRODUCT: solomotion

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'novincode/solomotion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      web: ${{ steps.plan.outputs.web }}
      desktop: ${{ steps.plan.outputs.desktop }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: node scripts/release.mjs plan

  verify:
    needs: plan
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      all: true

  web:
    needs: [plan, verify]
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/web run build:static
      - name: Pack the static bundle
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p release
          (cd apps/web/out && zip -qr "$GITHUB_WORKSPACE/release/solomotion-web-$VERSION.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: release/
          if-no-files-found: error

  desktop:
    needs: [plan, verify]
    if: needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/web run build:static
      - name: Build the installers (unsigned)
        working-directory: apps/desktop
        env:
          # No signing identity yet: build unsigned instead of failing the
          # search for one. The release notes say so.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --publish never
      - name: Collect the installers
        run: |
          mkdir -p release
          find apps/desktop/dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} release/ \;
          ls -l release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ runner.os }}
          path: release/
          if-no-files-found: error

  npm:
    needs: [plan, verify]
    if: needs.plan.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers on this environment make publishing a click, not a
    # side effect of a tag. npm's Trusted Publisher names it too.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Publish to npm with provenance
        run: node scripts/release.mjs publish

  release:
    needs: [plan, verify, web, desktop, npm]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.verify.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          mkdir -p release
          cd release
          if [ -n "$(ls -A)" ]; then sha256sum -- * > SHA256SUMS.txt; cat SHA256SUMS.txt; fi
      - name: Attest the build provenance of every asset
        if: hashFiles('release/SHA256SUMS.txt') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          node scripts/release.mjs notes > notes.md
          flags=(--verify-tag --title "SoloMotion $VERSION" --notes-file notes.md --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          shopt -s nullglob
          gh release create "$TAG" "${flags[@]}" release/*

  deploy:
    needs: [plan, release]
    if: needs.plan.outputs.web == 'true' && needs.plan.outputs.prerelease == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-app.yml
    # The deploy job runs in the `production` environment, whose own secrets
    # win over anything passed here.
    secrets: inherit
